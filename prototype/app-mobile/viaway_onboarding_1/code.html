</div>
</section>

<section class="px-margin-mobile pt-xl pb-xxl flex flex-col items-center text-center bg-background z-20">
<!-- Context -->
<div class="flex flex-col items-center mb-xl w-full">
<h1 class="font-h1 text-h1 text-on-background mb-sm max-w-[320px]">
                    Tudo em um só lugar
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[340px]">
                    Centralize seus voos, hotéis e itinerários em uma interface organizada e elegante.
                </p>
</div>
<!-- Page Indicators (Journey Progress) -->
<div aria-label="Progresso do onboarding" class="flex items-center gap-[6px] mb-xl">
<div class="w-8 h-[4px] bg-primary rounded-full transition-all duration-300"></div>
<div class="w-2 h-[4px] bg-surface-variant rounded-full transition-all duration-300"></div>
