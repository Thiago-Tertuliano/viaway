services:
  postgres:
    image: postgres:16-alpine
    container_name: viaway-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: viaway
    ports:
      - "5432:5432"
    volumes:
      - viaway_pg_data:/var/lib/postgresql/data

volumes:
  viaway_pg_data:
