<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom checkbox styles */
        .checkbox-custom {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.15em;
            height: 1.15em;
            border: 2px solid #76777d; /* outline color */
            border-radius: 0.25rem;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .checkbox-custom::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .checkbox-custom:checked {
            background-color: #000000; /* primary color */
            border-color: #000000;
        }

        .checkbox-custom:checked::before {
            transform: scale(1);
        }
        
        .checked-item-text {
            color: #76777d; /* outline color */
            text-decoration: line-through;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-[#F8FAFC] text-on-background min-h-screen pb-24 font-body-md">
<!-- TopAppBar -->
<header class="bg-[#F8FAFC] dark:bg-slate-950 text-[#0F172A] dark:text-slate-50 font-['Plus_Jakarta_Sans'] font-bold text-lg tracking-tight docked full-width top-0 border-b border-[#E2D1B3] dark:border-slate-800 shadow-none flex justify-between items-center w-full px-5 h-16 sticky z-10">
<div class="flex items-center gap-4">
<button class="hover:opacity-80 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-h3 text-h3">Japan 2024</h1>
</div>
<div class="flex items-center">
<button class="hover:opacity-80 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<main class="px-margin-mobile pt-lg max-w-2xl mx-auto">
<!-- Progress Section -->
<section class="mb-xl">
<div class="flex justify-between items-end mb-sm">
<div>
<h2 class="font-h1 text-h1 text-primary">Checklist</h2>
<p class="font-body-sm text-body-sm text-outline mt-1">12 of 24 items packed</p>
</div>
<span class="font-h3 text-h3 text-primary">50%</span>
</div>
<div class="w-full h-2 bg-[#E2D1B3] rounded-full overflow-hidden">
<div class="h-full bg-[#FF6B6B] rounded-full" style="width: 50%;"></div>
</div>
</section>
<!-- Categories List -->
<div class="space-y-lg">
<!-- Category: Documentos -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(15,23,42,0.05)] p-md">
<div class="flex items-center gap-sm mb-md pb-xs border-b border-surface-container">
<span class="material-symbols-outlined text-on-surface-variant fill">description</span>
<h3 class="font-h3 text-h3 text-on-background">Documentos</h3>
</div>
<ul class="space-y-sm">
<li class="flex items-center gap-md p-sm hover:bg-surface-container-low rounded-lg transition-colors">
<input checked="" class="checkbox-custom" id="item-doc-1" type="checkbox"/>
<label class="font-body-md text-body-md checked-item-text flex-1 cursor-pointer" for="item-doc-1">Passaporte</label>
</li>
<li class="flex items-center gap-md p-sm hover:bg-surface-container-low rounded-lg transition-colors">
<input checked="" class="checkbox-custom" id="item-doc-2" type="checkbox"/>
<label class="font-body-md text-body-md checked-item-text flex-1 cursor-pointer" for="item-doc-2">Visto (Impresso)</label>
</li>
<li class="flex items-center gap-md p-sm hover:bg-surface-container-low rounded-lg transition-colors">
<input class="checkbox-custom" id="item-doc-3" type="checkbox"/>
<label class="font-body-md text-body-md text-on-background flex-1 cursor-pointer" for="item-doc-3">Seguro Viagem</label>
</li>
<li class="flex items-center gap-md p-sm hover:bg-surface-container-low rounded-lg transition-colors">
<input class="checkbox-custom" id="item-doc-4" type="checkbox"/>
<label class="font-body-md text-body-md text-on-background flex-1 cursor-pointer" for="item-doc-4">Reservas de Hotel</label>
</li>
</ul>
</section>
<!-- Category: Mala -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(15,23,42,0.05)] p-md">
<div class="flex items-center gap-sm mb-md pb-xs border-b border-surface-container">
<span class="material-symbols-outlined text-on-surface-variant fill">luggage</span>
<h3 class="font-h3 text-h3 text-on-background">Mala Principal</h3>
</div>
<ul class="space-y-sm">
<li class="flex items-center gap-md p-sm hover:bg-surface-container-low rounded-lg transition-colors">
<input class="checkbox-custom" id="item-mala-1" type="checkbox"/>
<label class="font-body-md text-body-md text-on-background flex-1 cursor-pointer" for="item-mala-1">Camisetas (5)</label>
</li>
<li class="flex items-center gap-md p-sm hover:bg-surface-container-low rounded-lg transition-colors">
<input class="checkbox-custom" id="item-mala-2" type="checkbox"/>
<label class="font-body-md text-body-md text-on-background flex-1 cursor-pointer" for="item-mala-2">Calças (2)</label>
</li>
<li class="flex items-center gap-md p-sm hover:bg-surface-container-low rounded-lg transition-colors">
<input checked="" class="checkbox-custom" id="item-mala-3" type="checkbox"/>
<label class="font-body-md text-body-md checked-item-text flex-1 cursor-pointer" for="item-mala-3">Casaco de Frio</label>
</li>
<li class="flex items-center gap-md p-sm hover:bg-surface-container-low rounded-lg transition-colors">
<input class="checkbox-custom" id="item-mala-4" type="checkbox"/>
<label class="font-body-md text-body-md text-on-background flex-1 cursor-pointer" for="item-mala-4">Sapatos confortáveis</label>
</li>
</ul>
</section>
<!-- Category: Eletrônicos -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(15,23,42,0.05)] p-md">
<div class="flex items-center gap-sm mb-md pb-xs border-b border-surface-container">

</div>

<label class="font-body-md text-body-md checked-item-text flex-1 cursor-pointer" for="item-elec-1">Carregador Universal</label>
</li>
<li class="flex items-center gap-md p-sm hover:bg-surface-container-low rounded-lg transition-colors">

</li>
<li class="flex items-center gap-md p-sm hover:bg-surface-container-low rounded-lg transition-colors">
<input class="checkbox-custom" id="item-elec-3" type="checkbox"/>
<label class="font-body-md text-body-md text-on-background flex-1 cursor-pointer" for="item-elec-3">Fone com cancelamento de ruído</label>
</li>
</ul>
