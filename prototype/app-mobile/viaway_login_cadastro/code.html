<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            background-color: #F8FAFC; /* Forced background color as requested */

    body {
      min-height: max(884px, 100dvh);

<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- TopAppBar Content (Suppressed shell, but keeping the brand anchor) -->
<header class="w-full max-w-md mb-xxl flex justify-center">
<h1 class="font-h1 text-h1 text-[#0F172A] tracking-tighter">ViaWay</h1>
</header>
<main class="w-full max-w-md flex flex-col gap-lg">
<!-- Welcome Text -->
<div class="text-center mb-md">
<h2 class="font-h2 text-h2 text-on-surface mb-sm">Bem-vindo de volta</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Comece sua próxima jornada de descobertas.</p>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-sm">
<!-- Google Button (Ghost Style) -->
<button class="w-full flex items-center justify-center gap-sm py-[16px] rounded-lg border border-[#E2D1B3] bg-transparent text-[#0F172A] font-button text-button hover:bg-surface-container-low transition-colors">
<!-- Using a generic placeholder icon since brand icons aren't standard material symbols -->
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_circle</span>
                Continuar com Google
            </button>
<!-- Apple Button (Ghost Style) -->
<button class="w-full flex items-center justify-center gap-sm py-[16px] rounded-lg border border-[#E2D1B3] bg-transparent text-[#0F172A] font-button text-button hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">devices</span>
                Continuar com Apple
            </button>
</div>
<!-- Divider -->
<div class="flex items-center gap-md my-sm">
<div class="flex-1 h-px bg-[#E2D1B3]"></div>
<span class="font-label-md text-label-md text-outline">OU</span>
<div class="flex-1 h-px bg-[#E2D1B3]"></div>
</div>
<!-- Email Login Button -->
<button class="w-full py-[16px] rounded-lg bg-[#0F172A] text-on-primary font-button text-button hover:opacity-90 transition-opacity shadow-[0px_4px_20px_rgba(15,23,42,0.05)]">
            Entrar com e-mail
        </button>
<!-- Sign Up Link -->
<div class="text-center mt-lg">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Ainda não tem uma conta? 
                <a class="font-button text-button text-[#0F172A] hover:underline underline-offset-4 ml-xs" href="#">Criar conta</a>
</p>
</div>
</main>
