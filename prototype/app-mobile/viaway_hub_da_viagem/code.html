<div>

<h2 class="font-h3 text-h3 text-on-surface">Visita ao Louvre</h2>

</div>
<div class="flex items-center gap-4 text-on-surface-variant font-body-sm">

<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">location_on</span> Rue de Rivoli</span>

</div>
<span class="material-symbols-outlined text-on-primary">chevron_right</span>
