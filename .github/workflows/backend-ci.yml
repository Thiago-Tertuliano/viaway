name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test-and-build:
    name: Test and Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: development
      DISABLE_AUTH: "true"
      DEV_CLERK_ID: user_dev_ci
      DEV_USER_EMAIL: dev@viaway.local
      DEV_USER_NOME: Dev CI
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viaway_ci?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viaway_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viaway_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Seed database
        run: npm run db:seed

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  quality-gate:
    name: Quality Gate (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: NPM audit (prod deps)
        run: npm audit --omit=dev

      - name: Verify lockfile integrity
        run: npm ls --package-lock-only
