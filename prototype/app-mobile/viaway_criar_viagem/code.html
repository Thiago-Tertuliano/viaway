<style type="text/tailwindcss">

<body class="bg-background min-h-screen text-on-background antialiased flex flex-col pt-safe">
<!-- Task-Focused Header (Suppressed main nav as per rules) -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 shrink-0">
<button class="text-primary hover:opacity-80 transition-opacity p-xs -ml-xs tap-highlight-none" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="font-h3 text-h3 text-primary tracking-tight">ViaWay</div>
<div class="w-8"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 px-margin-mobile pb-xxl w-full max-w-md mx-auto flex flex-col">
<div class="mt-lg mb-xl">
<h1 class="font-h1 text-h1 text-primary mb-xs">Planejar</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Comece sua nova jornada.</p>
</div>
<!-- Form Card -->
<div class="bg-surface rounded-xl shadow-[0px_4px_20px_rgba(15,23,42,0.05)] p-lg flex flex-col gap-xl">
<!-- Destino -->
<div class="relative group">
<label class="font-label-md text-label-md text-on-primary-container block mb-xs" for="destino">Destino</label>
<div class="relative flex items-end">
<span class="material-symbols-outlined text-outline-variant mr-sm pb-sm group-focus-within:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">location_on</span>
<input class="input-minimal" id="destino" placeholder="Para onde você vai?" type="text"/>
</div>
</div>
<!-- Datas -->
<div class="grid grid-cols-2 gap-lg">
<!-- Data de Início -->
<div class="relative group">
<label class="font-label-md text-label-md text-on-primary-container block mb-xs" for="data_inicio">Data de Início</label>
<div class="relative flex items-end">
<span class="material-symbols-outlined text-outline-variant mr-sm pb-sm group-focus-within:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
<div class="relative w-full">
<input class="input-minimal" id="data_inicio" type="date"/>
</div>
</div>
</div>
<!-- Data de Fim -->
<div class="relative group">
<label class="font-label-md text-label-md text-on-primary-container block mb-xs" for="data_fim">Data de Fim</label>
<div class="relative flex items-end">
<div class="relative w-full">
<input class="input-minimal pl-sm" id="data_fim" type="date"/>
</div>
</div>
</div>
</div>
<!-- Orçamento Estimado -->
<div class="relative group">
<label class="font-label-md text-label-md text-on-primary-container block mb-xs" for="orcamento">Orçamento Estimado</label>
<div class="relative flex items-end">
<span class="material-symbols-outlined text-outline-variant mr-sm pb-sm group-focus-within:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">account_balance_wallet</span>
<input class="input-minimal" id="orcamento" placeholder="R$ 0,00" type="text"/>
</div>
</div>
</div>
<!-- Actions -->
<div class="mt-xl flex flex-col gap-md">
<button class="w-full bg-primary text-on-primary font-button text-button py-[16px] rounded-full tap-highlight-none hover:opacity-90 active:scale-[0.98] transition-all" type="button">
                Salvar Viagem
            </button>
<button class="w-full bg-transparent border border-outline text-primary font-button text-button py-[16px] rounded-full tap-highlight-none hover:bg-surface-container-low active:scale-[0.98] transition-all" type="button">
                Cancelar
            </button>
</div>
</main>
</body></html>
