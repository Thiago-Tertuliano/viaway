<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ViaWay - AI Itinerary Generator</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#eae7e9",
                        "secondary-fixed": "#f2e0c2",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#1b1b1d",
                        "on-primary-fixed-variant": "#3f465c",
                        "inverse-surface": "#303032",
                        "surface-container": "#f0edef",
                        "on-secondary-container": "#6e6149",
                        "on-tertiary-container": "#98805d",
                        "inverse-on-surface": "#f3f0f2",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#fcf8fa",
                        "surface-dim": "#dcd9db",
                        "background": "#fcf8fa",
                        "surface-tint": "#565e74",
                        "on-tertiary-fixed-variant": "#574425",
                        "tertiary-container": "#271901",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#231a08",
                        "error": "#ba1a1a",
                        "primary-container": "#131b2e",
                        "on-surface-variant": "#45464d",
                        "on-primary-container": "#7c839b",
                        "secondary-fixed-dim": "#d5c5a7",
                        "outline-variant": "#c6c6cd",
                        "tertiary-fixed-dim": "#dec29a",
                        "primary": "#000000",
                        "surface-container-highest": "#e4e2e4",
                        "secondary": "#695d45",
                        "on-tertiary-fixed": "#271901",
                        "surface-variant": "#e4e2e4",
                        "surface-container-low": "#f6f3f5",
                        "primary-fixed-dim": "#bec6e0",
                        "on-primary-fixed": "#131b2e",
                        "on-secondary-fixed-variant": "#51452f",
                        "error-container": "#ffdad6",
                        "secondary-container": "#efdebf",
                        "inverse-primary": "#bec6e0",
                        "outline": "#76777d",
                        "on-surface": "#1b1b1d",
                        "primary-fixed": "#dae2fd",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8fa",
                        "tertiary-fixed": "#fcdeb5",
                        "tertiary": "#000000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "margin-mobile": "20px",
                        "xl": "32px",
                        "sm": "8px",
                        "md": "16px",
                        "xs": "4px",
                        "xxl": "48px",
                        "gutter-mobile": "12px"
                    },
                    "fontFamily": {
                        "h1": ["Plus Jakarta Sans"],
                        "h2": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "h3": ["Plus Jakarta Sans"],
                        "button": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "h2": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "h3": ["20px", { "lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "button": ["16px", { "lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .sparkle-gradient {
            background: linear-gradient(135deg, #131b2e 0%, #2a3b63 100%);
        }
        .pro-badge-gradient {
            background: linear-gradient(90deg, #d5c5a7 0%, #f2e0c2 100%);
        }
        .glow-effect {
            box-shadow: 0 0 20px rgba(242, 224, 194, 0.3);
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            border: 2px solid #131b2e;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #f2e0c2;
            border-radius: 2px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-primary-container text-on-primary min-h-screen flex flex-col font-body-md overflow-x-hidden antialiased">
<!-- TopAppBar -->
<header class="docked full-width top-0 shadow-none border-b border-on-primary-fixed-variant/30 flex justify-between items-center w-full px-5 h-16 bg-primary-container z-50">
<button aria-label="Close" class="text-on-primary hover:opacity-80 transition-opacity flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="font-['Plus_Jakarta_Sans'] font-bold text-lg tracking-tight flex items-center gap-2">
<span class="text-2xl font-extrabold text-on-primary tracking-tighter">ViaWay</span>
<span class="pro-badge-gradient text-primary px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">Pro</span>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile pt-lg pb-xxl pb-safe relative sparkle-gradient">
<!-- Background decorative elements -->
<div class="absolute top-0 right-0 w-64 h-64 bg-secondary-fixed/5 rounded-full blur-3xl -mr-20 -mt-10 pointer-events-none"></div>
<div class="absolute bottom-40 left-0 w-80 h-80 bg-primary-fixed/5 rounded-full blur-3xl -ml-20 pointer-events-none"></div>
<!-- Hero Title -->
<div class="mb-xl relative z-10">
<h1 class="font-h1 text-h1 text-on-primary mb-sm">AI Itinerary Magic</h1>
<p class="font-body-lg text-body-lg text-inverse-primary/80">Tell us what you love, and we'll craft the perfect journey.</p>
</div>
<div class="flex-1 space-y-xl z-10 relative">
<!-- Destination Input (Floating Label style) -->
<div class="relative bg-on-primary-fixed-variant/20 rounded-xl p-md border border-on-primary-fixed-variant/40 backdrop-blur-sm">
<label class="font-label-md text-label-md text-secondary-fixed mb-xs block">DESTINATION</label>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-inverse-primary" style="font-variation-settings: 'FILL' 0;">location_on</span>
<input class="w-full bg-transparent border-none text-on-primary font-body-lg focus:ring-0 placeholder:text-inverse-primary/50 p-0" placeholder="Where do you want to go?" type="text" value="Kyoto, Japan"/>
</div>
</div>
<!-- Vibe Slider -->
<div class="bg-on-primary-fixed-variant/20 rounded-xl p-md border border-on-primary-fixed-variant/40 backdrop-blur-sm">
<div class="flex justify-between items-end mb-lg">
<label class="font-label-md text-label-md text-secondary-fixed block">THE VIBE</label>
<span class="font-body-sm text-body-sm text-inverse-primary/80">Balanced</span>
</div>
<div class="px-2 mb-sm">
<input class="w-full" max="100" min="1" type="range" value="50"/>
</div>
<div class="flex justify-between font-label-md text-[10px] text-inverse-primary/60 uppercase tracking-wider">
<span>Deeply Relaxing</span>
<span>High Adventure</span>
</div>
</div>
<!-- Interests Bento -->
<div>
<label class="font-label-md text-label-md text-secondary-fixed mb-md block">WHAT DRIVES YOU</label>
<div class="grid grid-cols-2 gap-sm">
<!-- Selected Card -->
<button class="bg-secondary-fixed/10 border-2 border-secondary-fixed rounded-xl p-md flex flex-col items-start gap-sm text-left transition-all relative overflow-hidden">
<div class="absolute inset-0 bg-secondary-fixed/5"></div>
<span class="material-symbols-outlined text-secondary-fixed relative z-10" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<span class="font-h3 text-h3 text-on-primary relative z-10">Culinary</span>
</button>
<!-- Unselected Card -->
<button class="bg-on-primary-fixed-variant/20 border-2 border-transparent rounded-xl p-md flex flex-col items-start gap-sm text-left hover:bg-on-primary-fixed-variant/30 transition-all">
<span class="material-symbols-outlined text-inverse-primary" style="font-variation-settings: 'FILL' 0;">palette</span>
<span class="font-h3 text-h3 text-inverse-primary">Art &amp; Culture</span>
</button>
<!-- Unselected Card -->
<button class="bg-on-primary-fixed-variant/20 border-2 border-transparent rounded-xl p-md flex flex-col items-start gap-sm text-left hover:bg-on-primary-fixed-variant/30 transition-all">
<span class="material-symbols-outlined text-inverse-primary" style="font-variation-settings: 'FILL' 0;">nature_people</span>
<span class="font-h3 text-h3 text-inverse-primary">Nature</span>
</button>
<!-- Selected Card -->
<button class="bg-secondary-fixed/10 border-2 border-secondary-fixed rounded-xl p-md flex flex-col items-start gap-sm text-left transition-all relative overflow-hidden">
<div class="absolute inset-0 bg-secondary-fixed/5"></div>
<span class="material-symbols-outlined text-secondary-fixed relative z-10" style="font-variation-settings: 'FILL' 1;">nightlife</span>
<span class="font-h3 text-h3 text-on-primary relative z-10">Nightlife</span>
</button>
</div>
</div>
<!-- Budget Toggle -->
<div>
<label class="font-label-md text-label-md text-secondary-fixed mb-md block">BUDGET LEVEL</label>
<div class="flex gap-sm">
<button class="flex-1 py-md px-sm rounded-lg border border-on-primary-fixed-variant/40 bg-on-primary-fixed-variant/20 text-inverse-primary font-body-md">Economy</button>
<button class="flex-1 py-md px-sm rounded-lg border-2 border-secondary-fixed bg-secondary-fixed/10 text-on-primary font-button">Comfort</button>
<button class="flex-1 py-md px-sm rounded-lg border border-on-primary-fixed-variant/40 bg-on-primary-fixed-variant/20 text-inverse-primary font-body-md">Luxury</button>
</div>
</div>
</div>
</main>
<!-- Bottom Sticky Action -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-primary-container via-primary-container to-transparent z-40 pb-safe pt-xl">
<button class="w-full bg-secondary-fixed text-primary py-4 rounded-full font-button text-button flex items-center justify-center gap-sm glow-effect hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
            Gerar Roteiro Mágico
        </button>
</div>
</body></html>
