<body class="bg-[#F8FAFC] text-[#0F172A] min-h-screen flex flex-col font-body-md text-body-md antialiased selection:bg-[#E2D1B3] selection:text-[#0F172A]">
<!-- TopAppBar -->
<header class="docked full-width top-0 border-b border-[#E2D1B3] shadow-none flex items-center justify-between px-5 h-16 w-full bg-[#F8FAFC] z-50 sticky">
<button aria-label="Voltar" class="text-[#0F172A] hover:opacity-70 transition-opacity active:scale-95 transition-transform flex items-center justify-center p-2 -ml-2 rounded-full focus:outline-none focus:ring-2 focus:ring-[#E2D1B3]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-lg font-bold text-[#0F172A] font-['Plus_Jakarta_Sans'] font-semibold tracking-tight absolute left-1/2 transform -translate-x-1/2">
            Alterar Senha
        </h1>
<div class="w-10"></div> <!-- Spacer to center title -->
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col px-margin-mobile pt-lg pb-xxl max-w-md mx-auto w-full">
<!-- Intro Text -->
<p class="text-body-md font-body-md text-on-surface-variant mb-xl leading-relaxed">
            Para sua segurança, escolha uma senha forte e que você não use em outros serviços.
        </p>
<!-- Form -->
<form class="flex flex-col gap-lg flex-grow">
<!-- Input: Senha Atual -->
<div class="flex flex-col gap-sm relative">
<label class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider" for="current-password">Senha Atual</label>
<div class="relative flex items-center">
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-sm px-0 focus:ring-0 focus:border-[#0F172A] text-body-lg font-body-lg text-on-surface transition-colors pb-sm placeholder-outline" id="current-password" name="current-password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Mostrar senha" class="absolute right-0 text-outline hover:text-on-surface transition-colors p-sm focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Input: Nova Senha -->
<div class="flex flex-col gap-sm relative mt-sm">
<label class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider" for="new-password">Nova Senha</label>
<div class="relative flex items-center">
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-sm px-0 focus:ring-0 focus:border-[#0F172A] text-body-lg font-body-lg text-on-surface transition-colors pb-sm placeholder-outline" id="new-password" name="new-password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Mostrar senha" class="absolute right-0 text-outline hover:text-on-surface transition-colors p-sm focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Input: Confirmar Nova Senha -->
<div class="flex flex-col gap-sm relative">
<label class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider" for="confirm-password">Confirmar Nova Senha</label>
<div class="relative flex items-center">
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-sm px-0 focus:ring-0 focus:border-[#0F172A] text-body-lg font-body-lg text-on-surface transition-colors pb-sm placeholder-outline" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Mostrar senha" class="absolute right-0 text-outline hover:text-on-surface transition-colors p-sm focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Password Tips -->
<div class="mt-md bg-white rounded-xl p-md shadow-[0px_4px_20px_rgba(15,23,42,0.05)] border border-[#E2D1B3]/20">
<h3 class="text-label-md font-label-md text-[#0F172A] mb-sm uppercase tracking-wider">Dicas de senha forte</h3>
<ul class="flex flex-col gap-xs">
<li class="flex items-center gap-sm text-body-sm font-body-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-outline" data-icon="check_circle">check_circle</span>
                        Mínimo de 8 caracteres
                    </li>
<li class="flex items-center gap-sm text-body-sm font-body-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-outline" data-icon="check_circle">check_circle</span>
                        Incluir números e símbolos
                    </li>
</ul>
</div>
<div class="flex-grow"></div> <!-- Spacer to push button down if needed -->
<!-- Action Button -->
<div class="mt-xl pt-lg">
<button class="w-full bg-[#0F172A] text-white py-[16px] px-lg rounded-full text-button font-button hover:bg-opacity-90 active:scale-[0.98] transition-all duration-200 shadow-[0px_8px_30px_rgba(15,23,42,0.1)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0F172A] focus:ring-offset-[#F8FAFC]" type="submit">
                    Atualizar Senha
                </button>
</div>
</form>
