<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Subscription Management - ViaWay</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#f2e0c2",
                        "surface-container-high": "#eae7e9",
                        "on-tertiary-container": "#98805d",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dcd9db",
                        "surface-variant": "#e4e2e4",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#dae2fd",
                        "on-tertiary-fixed-variant": "#574425",
                        "surface-container-highest": "#e4e2e4",
                        "on-secondary-fixed": "#231a08",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-tint": "#565e74",
                        "on-secondary-fixed-variant": "#51452f",
                        "inverse-primary": "#bec6e0",
                        "tertiary-fixed-dim": "#dec29a",
                        "on-background": "#1b1b1d",
                        "surface-container-low": "#f6f3f5",
                        "secondary-container": "#efdebf",
                        "tertiary-container": "#271901",
                        "surface": "#fcf8fa",
                        "on-error": "#ffffff",
                        "background": "#fcf8fa",
                        "surface-container": "#f0edef",
                        "primary-container": "#131b2e",
                        "inverse-surface": "#303032",
                        "outline": "#76777d",
                        "on-secondary-container": "#6e6149",
                        "primary": "#000000",
                        "secondary-fixed-dim": "#d5c5a7",
                        "on-primary-fixed": "#131b2e",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f3f0f2",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#271901",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#fcdeb5",
                        "primary-fixed-dim": "#bec6e0",
                        "on-primary-container": "#7c839b",
                        "secondary": "#695d45",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#45464d",
                        "tertiary": "#000000",
                        "surface-bright": "#fcf8fa",
                        "on-surface": "#1b1b1d",
                        "outline-variant": "#c6c6cd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "xs": "4px",
                        "gutter-mobile": "12px",
                        "xxl": "48px",
                        "sm": "8px",
                        "margin-mobile": "20px",
                        "xl": "32px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "button": ["Inter"],
                        "h2": ["Plus Jakarta Sans"],
                        "h3": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "h1": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "button": ["16px", { "lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "h2": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "h3": ["20px", { "lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F8FAFC; /* Fallback/Brand background */
        }
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F8FAFC] text-on-surface min-h-screen flex flex-col font-body-md antialiased pb-24">
<!-- TopAppBar -->
<header class="bg-[#F8FAFC] dark:bg-slate-950 font-['Plus_Jakarta_SANS'] font-semibold tracking-tight docked full-width top-0 border-b border-[#E2D1B3] dark:border-slate-800 flat no-shadow flex items-center justify-between px-5 h-16 w-full sticky z-40">
<button class="text-[#0F172A] dark:text-slate-100 transition-all duration-200 active:scale-95 hover:bg-[#E2D1B3]/10 dark:hover:bg-slate-800 p-2 rounded-full -ml-2 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-xl font-black text-[#0F172A] dark:text-white flex-1 text-center pr-8">Subscription</h1>
</header>
<main class="flex-1 px-margin-mobile pt-lg max-w-lg mx-auto w-full">
<!-- Current Plan Card -->
<section class="bg-surface-container-lowest rounded-[16px] p-lg shadow-[0px_4px_20px_rgba(15,23,42,0.05)] mb-lg relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-secondary-fixed/20 rounded-bl-[100px] -mr-8 -mt-8 pointer-events-none"></div>
<div class="flex justify-between items-start mb-md">
<div>
<h2 class="font-h2 text-h2 text-primary-container mb-xs">ViaWay Pro</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Billed annually</p>
</div>
<div class="bg-[#10B981]/10 px-sm py-xs rounded-[8px] flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-[#10B981]"></div>
<span class="font-label-md text-label-md text-[#10B981]">ACTIVE</span>
</div>
</div>
<div class="flex items-baseline gap-xs mb-lg border-b border-surface-variant pb-md">
<span class="font-h1 text-h1 text-primary-container">$119</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">/ year</span>
</div>
<div class="flex items-center justify-between bg-surface-container-low p-md rounded-lg">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-primary-container">event_repeat</span>
<div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase mb-[2px]">Next Renewal</p>
<p class="font-body-md text-body-md text-primary-container font-semibold">Oct 12, 2024</p>
</div>
</div>
</div>
</section>
<!-- Payment Method -->
<section class="bg-surface-container-lowest rounded-[16px] p-lg shadow-[0px_4px_20px_rgba(15,23,42,0.05)] mb-xl">
<div class="flex justify-between items-center mb-md">
<h3 class="font-h3 text-h3 text-primary-container">Payment Method</h3>
<button class="font-button text-button text-primary-container hover:opacity-70 transition-opacity">Edit</button>
</div>
<div class="flex items-center gap-md border border-surface-variant rounded-lg p-md">
<div class="w-12 h-8 bg-surface-container-high rounded flex items-center justify-center">
<span class="font-h3 text-[14px] font-bold text-primary-container italic">VISA</span>
</div>
<div class="flex-1">
<p class="font-body-md text-body-md text-primary-container font-semibold">•••• •••• •••• 4242</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Expires 12/25</p>
</div>
<span class="material-symbols-outlined text-primary-container/50">check_circle</span>
</div>
</section>
<!-- Options List -->
<section class="flex flex-col gap-sm">
<button class="w-full bg-surface-container-lowest rounded-lg p-md shadow-[0px_4px_20px_rgba(15,23,42,0.05)] flex items-center justify-between hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary-container group-hover:text-primary transition-colors">receipt_long</span>
<span class="font-body-md text-body-md text-primary-container font-semibold">View Billing History</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<button class="w-full bg-surface-container-lowest rounded-lg p-md shadow-[0px_4px_20px_rgba(15,23,42,0.05)] flex items-center justify-between hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary-container group-hover:text-primary transition-colors">swap_horiz</span>
<span class="font-body-md text-body-md text-primary-container font-semibold">Change Plan</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<div class="mt-md">
<button class="w-full bg-surface-bright border border-error/20 rounded-lg p-md flex items-center justify-center gap-sm hover:bg-error/5 transition-colors">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 0;">cancel</span>
<span class="font-button text-button text-error">Cancel Subscription</span>
</button>
</div>
</section>
</main>
<!-- Navigation Suppressed as this is a transactional/settings screen logically -->
</body></html>
