<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar (Adapted for Modal/Task Flow - Hiding BottomNav as per rules) -->
<header class="bg-[#F8FAFC] dark:bg-slate-950 text-[#0F172A] dark:text-slate-50 font-['Plus_Jakarta_Sans'] font-semibold tracking-tight docked full-width top-0 border-b border-[#E2D1B3]/30 dark:border-slate-800 shadow-none flex justify-between items-center w-full px-5 h-16 sticky z-50">
<button class="text-[#0F172A] dark:text-slate-50 hover:opacity-70 transition-opacity flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined">close</span>
</button>
<span class="text-xl font-bold tracking-tighter text-[#0F172A] dark:text-slate-50">Adicionar Gasto</span>
<div class="w-8"></div> <!-- Spacer to balance center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-margin-mobile py-lg pb-[100px]">
<!-- Form Container -->
<form class="flex flex-col gap-xl w-full">
<!-- Amount Input -->
<div class="flex flex-col items-center justify-center py-lg gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase">Valor</label>
<div class="flex items-center gap-xs">
<span class="font-h1 text-h1 text-on-surface">R$</span>
<input class="font-h1 text-h1 text-on-surface bg-transparent border-none text-center focus:ring-0 w-48 p-0 placeholder-on-surface-variant/30" placeholder="0,00" type="number"/>
</div>
</div>
<div class="flex flex-col gap-lg">
<!-- Title Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Título da despesa</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-sm px-0 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 placeholder-on-surface-variant/50" placeholder="Ex: Jantar em Roma" type="text"/>
</div>
<!-- Category Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Categoria</label>
<div class="w-full flex items-center justify-between border-b border-outline-variant py-sm cursor-pointer hover:opacity-80">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant">restaurant</span>
<span class="font-body-md text-body-md text-on-surface">Alimentação</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Date Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Data</label>
<div class="w-full flex items-center justify-between border-b border-outline-variant py-sm cursor-pointer hover:opacity-80">
<span class="font-body-md text-body-md text-on-surface">Hoje, 24 Out</span>
<span class="material-symbols-outlined text-on-surface-variant">calendar_today</span>
</div>
</div>
</div>
<!-- Receipt Upload Area -->
<div class="flex flex-col gap-sm mt-md">
<label class="font-label-md text-label-md text-on-surface-variant">Comprovante</label>
<div class="w-full border border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-sm bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors min-h-[120px]">
<span class="material-symbols-outlined text-on-surface-variant text-3xl">add_photo_alternate</span>
<span class="font-body-md text-body-md text-on-surface-variant">Adicionar recibo</span>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant/30 px-margin-mobile py-md pb-safe">
<div class="max-w-md mx-auto">
<button class="w-full bg-primary text-on-primary font-button text-button py-[16px] rounded-full shadow-[0_8px_30px_rgba(15,23,42,0.1)] hover:opacity-90 transition-opacity">
